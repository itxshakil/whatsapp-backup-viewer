name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    # LTS is what most people run; current catches breakage early, like Node 25's
    # built-in localStorage shadowing jsdom's.
    strategy:
      fail-fast: false
      matrix:
        node: [lts/*, current]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Type check and build
        run: npm run build

      - name: Tests
        run: npx vitest run
